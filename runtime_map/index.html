<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GameDraft 运行时结构图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #eef1ee;
  --paper: #fbfcfa;
  --paper2: #f4f6f3;
  --ink: #1b2427;
  --ink2: #3c484c;
  --muted: #667377;
  --line: #d3d9d5;
  --line2: #e3e8e5;
  --accent: #17656e;
  --accent-soft: #d6e8e8;
  --event: #b8611f;
  --event-soft: #f3e2d3;
  --create: #6552a3;
  --create-soft: #e6e1f3;
  --ok: #2e7a4b;
  --ok-soft: #dcefe2;
  --warn: #9a6410;
  --warn-soft: #f4e8cf;
  --bad: #a93a2f;
  --bad-soft: #f5dcd8;
  --off: #7d8380;
  --off-soft: #e5e7e5;
  --band: rgba(23, 101, 110, 0.045);
  --shadow: 0 1px 2px rgba(20, 30, 32, .06), 0 4px 18px rgba(20, 30, 32, .06);
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", "Hiragino Sans GB", sans-serif;
  --f-disp: "Noto Serif SC", "Songti SC", "SimSun", "Source Han Serif SC", serif;
  --f-mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1416; --paper: #161e21; --paper2: #1b2427; --ink: #e1e7e5; --ink2: #c1cbc9; --muted: #8d9b9e;
    --line: #2b373a; --line2: #222c2f; --accent: #5db2bc; --accent-soft: #1b3a3e; --event: #e38e52; --event-soft: #3d2b1d;
    --create: #a695e0; --create-soft: #2c2745; --ok: #5dbb82; --ok-soft: #1d3326; --warn: #d9a548; --warn-soft: #3a2f18;
    --bad: #e0766a; --bad-soft: #3d2320; --off: #7c8482; --off-soft: #262d2e; --band: rgba(93, 178, 188, 0.05);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1416; --paper: #161e21; --paper2: #1b2427; --ink: #e1e7e5; --ink2: #c1cbc9; --muted: #8d9b9e;
  --line: #2b373a; --line2: #222c2f; --accent: #5db2bc; --accent-soft: #1b3a3e; --event: #e38e52; --event-soft: #3d2b1d;
  --create: #a695e0; --create-soft: #2c2745; --ok: #5dbb82; --ok-soft: #1d3326; --warn: #d9a548; --warn-soft: #3a2f18;
  --bad: #e0766a; --bad-soft: #3d2320; --off: #7c8482; --off-soft: #262d2e; --band: rgba(93, 178, 188, 0.05);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.6 var(--f-body); }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
code, .mono { font-family: var(--f-mono); font-size: 12px; }
h1, h2, h3 { font-family: var(--f-disp); text-wrap: balance; margin: 0; font-weight: 700; }
h2 { font-size: 20px; }
h3 { font-size: 15px; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── 顶栏 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
.top-inner { display: flex; gap: 16px; align-items: center; padding: 10px 16px 0; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.brand h1 { font-size: 19px; letter-spacing: .02em; }
.brand .sub { color: var(--muted); font-size: 12px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; padding: 8px 16px 0; scrollbar-width: thin; }
.tab { border: 0; background: none; padding: 7px 11px 9px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-size: 13.5px; }
.tab .n { font-family: var(--f-mono); font-size: 11px; opacity: .7; margin-right: 4px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
.theme-btn { margin-left: auto; border: 1px solid var(--line); background: var(--paper2); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px; color: var(--muted); }

/* ── 主体 + 证据抽屉 */
.shell { display: grid; grid-template-columns: minmax(0, 1fr) var(--drawer-w, 0px); min-height: calc(100% - 96px); }
.shell.drawer-open { --drawer-w: min(460px, 42vw); }
main { padding: 18px 16px 60px; min-width: 0; }
.drawer { border-left: 1px solid var(--line); background: var(--paper); position: sticky; top: 96px; height: calc(100vh - 96px); overflow: auto; }
.drawer-head { position: sticky; top: 0; background: var(--paper); border-bottom: 1px solid var(--line2); padding: 12px 14px 10px; display: flex; gap: 8px; align-items: flex-start; z-index: 2; }
.drawer-head h3 { flex: 1; font-size: 15px; }
.drawer-head .x { border: 0; background: var(--paper2); border-radius: 6px; cursor: pointer; padding: 2px 9px; color: var(--muted); }
.drawer-body { padding: 12px 14px 40px; display: flex; flex-direction: column; gap: 10px; }
@media (max-width: 860px) {
  .shell.drawer-open { --drawer-w: 0px; }
  .drawer { position: fixed; inset: auto 0 0 0; height: 62vh; top: auto; border-left: 0; border-top: 1px solid var(--line); z-index: 30; box-shadow: var(--shadow); padding-bottom: env(safe-area-inset-bottom, 0px); }
}

.section-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.section-head p { margin: 0; color: var(--muted); font-size: 13px; max-width: 70ch; }
.lede { color: var(--ink2); max-width: 78ch; margin: 4px 0 14px; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }
.pad { padding: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 14px; align-items: start; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ── 小件 */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 0 7px; border-radius: 999px; font-size: 11.5px; line-height: 20px; background: var(--chip, var(--paper2)); color: var(--ink2); border: 1px solid var(--line2); white-space: nowrap; }
.chip.dep { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.evt { background: var(--event-soft); color: var(--event); border-color: transparent; }
.chip.crt { background: var(--create-soft); color: var(--create); border-color: transparent; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.off { background: var(--off-soft); color: var(--off); border-color: transparent; text-decoration: line-through; text-decoration-thickness: 1px; }
.chip.dev { background: var(--off-soft); color: var(--muted); border: 1px dashed var(--off); }
.chip.btn { cursor: pointer; }
.chip.btn[aria-pressed="true"] { outline: 2px solid currentColor; outline-offset: -1px; }
.kbd { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.linkish { color: var(--accent); cursor: pointer; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent); text-underline-offset: 2px; background: none; border: 0; padding: 0; text-align: left; }

/* ── 出处 */
.cite { border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; background: var(--paper2); }
.cite-head { display: flex; gap: 8px; align-items: center; padding: 3px 8px; font-family: var(--f-mono); font-size: 11.5px; border-bottom: 1px solid var(--line2); background: var(--paper); }
.cite-head a { text-decoration: none; }
.cite-head .why { color: var(--muted); font-family: var(--f-body); margin-left: auto; font-size: 11px; }
.cite pre { margin: 0; padding: 5px 0; overflow-x: auto; font: 11.5px/1.55 var(--f-mono); }
.cite pre .ln { display: inline-block; width: 44px; text-align: right; padding-right: 8px; color: var(--muted); user-select: none; }
.cite pre .hit { background: color-mix(in srgb, var(--accent) 14%, transparent); display: block; }
.cite pre .hit mark { background: color-mix(in srgb, var(--warn) 30%, transparent); color: inherit; border-radius: 2px; }
.cite pre span.l { display: block; white-space: pre; padding-right: 10px; }
.cites-inline { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.cref { font-family: var(--f-mono); font-size: 11px; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 4px; padding: 0 5px; cursor: pointer; line-height: 18px; }
.cref:hover { filter: brightness(1.05); text-decoration: underline; }

/* ── 表格 */
.tbl-wrap { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.t th, table.t td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line2); vertical-align: top; }
table.t th { font-weight: 500; color: var(--muted); font-size: 11.5px; letter-spacing: .03em; background: var(--paper); position: sticky; top: 0; }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.t tr.clickable { cursor: pointer; }
table.t tr.clickable:hover td { background: var(--paper2); }

details.fold { border: 1px solid var(--line2); border-radius: 6px; background: var(--paper); }
details.fold > summary { cursor: pointer; padding: 6px 10px; font-weight: 500; list-style: none; display: flex; gap: 8px; align-items: center; }
details.fold > summary::before { content: "▸"; color: var(--muted); font-size: 11px; transition: transform .15s; }
details.fold[open] > summary::before { transform: rotate(90deg); }
details.fold > .fold-body { padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 6px; }

/* ── 模块总图 */
.map-wrap { overflow-x: auto; }
.map-toolbar { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; font-size: 13px; }
.map-toolbar label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.swatch { display: inline-block; width: 26px; height: 0; border-top: 2.5px solid; vertical-align: middle; }
.swatch.dep { border-color: var(--accent); }
.swatch.typ { border-color: var(--accent); border-top-style: dotted; opacity: .7; }
.swatch.evt { border-color: var(--event); border-top-style: dashed; }
.swatch.crt { border-color: var(--create); border-top-style: dotted; border-top-width: 3px; }
svg.map { display: block; min-width: 1000px; width: 100%; height: max(560px, calc(100vh - 262px)); font-family: var(--f-body); }
svg .band { fill: var(--band); }
svg .band-label { fill: var(--muted); font-size: 11px; letter-spacing: .08em; }
svg .blk rect.box { fill: var(--paper); stroke: var(--line); stroke-width: 1.2; }
svg .blk { cursor: pointer; }
svg .blk:hover rect.box, svg .blk.sel rect.box { stroke: var(--ink2); stroke-width: 2; }
svg .blk .bname { font-size: 13.5px; font-weight: 700; fill: var(--ink); font-family: var(--f-disp); }
svg .blk .bmeta { font-size: 10.5px; fill: var(--muted); font-family: var(--f-mono); }
svg .blk .bfile { font-size: 10px; fill: var(--ink2); font-family: var(--f-mono); }
svg .blk.boundary rect.box { stroke-dasharray: 5 4; fill: var(--paper2); }
svg .edge { fill: none; stroke-linecap: round; }
svg .edge.dep { stroke: var(--accent); }
svg .edge.typ { stroke: var(--accent); stroke-dasharray: 2 4; opacity: .7; }
svg .edge.evt { stroke: var(--event); stroke-dasharray: 7 5; }
svg .edge.crt { stroke: var(--create); stroke-dasharray: 1 5; }
svg .edge.asm { opacity: .28; }
svg .elabel.asm { opacity: .35; }
svg .edge-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
svg.dim .edge { opacity: .07; }
svg.dim .edge.hl { opacity: 1; }
svg.dim .edge.asm.hl { opacity: .9; }
svg.dim .blk:not(.hl) { opacity: .45; }
svg .elabel { font-size: 10px; font-family: var(--f-mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; }
svg .elabel.dep { fill: var(--accent); }
svg .elabel.evt { fill: var(--event); }
svg .elabel.crt { fill: var(--create); }
svg .elabel.typ { fill: var(--accent); }
svg.dim .elabel { opacity: 0; }
svg.dim .elabel.hl { opacity: 1; }

.dig-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
svg.dig { display: block; font-family: var(--f-mono); }
svg.dig .fnode rect { fill: var(--paper); stroke: var(--line); }
svg.dig .fnode.dbg rect { stroke-dasharray: 4 3; }
svg.dig .fnode.ext rect { fill: var(--paper2); }
svg.dig .fnode { cursor: pointer; }
svg.dig .fnode text { font-size: 10.5px; fill: var(--ink); }
svg.dig .fnode text.n { fill: var(--muted); font-size: 9.5px; }
svg.dig .fnode:hover rect, svg.dig .fnode.sel rect { stroke: var(--ink2); stroke-width: 1.8; }
svg.dig.dim .edge { opacity: .06; }
svg.dig.dim .edge.hl { opacity: 1; }
svg.dig.dim .fnode:not(.hl) { opacity: .4; }
svg.dig .colhead { font-size: 10px; fill: var(--muted); font-family: var(--f-body); letter-spacing: .06em; }
.crumb { display: flex; gap: 6px; align-items: center; font-size: 13px; margin-bottom: 8px; flex-wrap: wrap; }

.catalog { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 215px), 1fr)); gap: 10px; margin-top: 14px; }
.cat { text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
.cat:hover { border-color: var(--ink2); }
.cat .no { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.cat .ti { font-family: var(--f-disp); font-weight: 700; font-size: 14.5px; }
.cat .de { font-size: 12px; color: var(--muted); line-height: 1.5; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.stats b { font-family: var(--f-mono); color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ── 顺序类图 */
.seq { display: flex; flex-direction: column; gap: 8px; }
.phase { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
.phase > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: baseline; padding: 10px 12px; }
.phase > summary .pn { font-family: var(--f-mono); color: var(--muted); font-size: 12px; }
.phase > summary .pt { font-family: var(--f-disp); font-weight: 700; font-size: 14.5px; }
.phase > summary .ps { grid-column: 2 / 4; color: var(--muted); font-size: 12.5px; }
.phase[open] > summary { border-bottom: 1px solid var(--line2); }
.steps { display: flex; flex-direction: column; padding: 6px 0; }
.step { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 8px; padding: 5px 12px; align-items: baseline; cursor: pointer; border-left: 3px solid transparent; }
.step:hover { background: var(--paper2); }
.step.sel { border-left-color: var(--accent); background: var(--paper2); }
.step .sn { font-family: var(--f-mono); font-size: 11px; color: var(--muted); text-align: right; }
.step .sl { font-weight: 500; }
.step .sd { color: var(--muted); font-size: 12.5px; grid-column: 2 / 3; }
.step .sc { grid-column: 2 / 3; font-family: var(--f-mono); font-size: 11px; color: var(--ink2); overflow-wrap: anywhere; }
.step .tags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.step.disabled .sl { text-decoration: line-through; color: var(--off); }
.step.faded { opacity: .28; }
.grouphead { font-size: 11px; letter-spacing: .08em; color: var(--muted); padding: 10px 12px 2px 72px; text-transform: uppercase; }
.callout { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
.callout:hover { border-color: var(--ink2); }
.callout .ct { font-weight: 700; font-family: var(--f-disp); }

.matrix td.cell { text-align: center; font-size: 11px; font-family: var(--f-mono); min-width: 34px; padding: 3px 4px; }
.matrix td.run { background: var(--ok-soft); color: var(--ok); }
.matrix td.stop { color: var(--off); }
.matrix td.partial { background: var(--warn-soft); color: var(--warn); }
.matrix th.st { writing-mode: vertical-rl; text-orientation: upright; padding: 6px 2px; font-size: 11px; white-space: nowrap; letter-spacing: -.05em; max-height: 120px; }
.matrix th.st.cur, .matrix td.cur { outline: 2px solid var(--accent); outline-offset: -2px; }

.lanes { display: grid; gap: 0; font-size: 12.5px; }
.lane-h { font-weight: 700; font-size: 11.5px; padding: 6px 6px; border-bottom: 1px solid var(--line); background: var(--paper); position: sticky; top: 0; z-index: 1; text-align: center; }
.lane-c { border-left: 1px dashed var(--line2); padding: 3px 5px; min-height: 30px; }
.lane-n { font-family: var(--f-mono); font-size: 11px; color: var(--muted); text-align: right; padding: 7px 6px 0 0; }
.lane-card { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; cursor: pointer; }
.lane-card:hover, .lane-card.sel { border-color: var(--ink2); }
.lane-card .lt { font-weight: 500; }
.lane-card .ld { color: var(--muted); font-size: 11.5px; }

.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 10px; }
.board-col { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); display: flex; flex-direction: column; }
.board-col h3 { padding: 8px 10px; border-bottom: 1px solid var(--line2); display: flex; gap: 8px; align-items: center; }
.board-col .items { display: flex; flex-direction: column; gap: 6px; padding: 8px; }
.store { border: 1px solid var(--line2); border-radius: 6px; padding: 6px 8px; cursor: pointer; background: var(--paper); }
.store:hover { border-color: var(--ink2); }
.store .sn2 { font-weight: 500; }
.store .so { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.store .sw { font-size: 12px; color: var(--ink2); }

.tree { font-size: 13px; }
.tree .tn { display: flex; gap: 6px; align-items: baseline; padding: 3px 6px; border-radius: 5px; cursor: pointer; }
.tree .tn:hover { background: var(--paper2); }
.tree .tn .o { font-family: var(--f-mono); font-size: 11px; color: var(--muted); min-width: 22px; text-align: right; }
.tree .tn .w { color: var(--muted); font-size: 12px; }
.pass { display: grid; grid-template-columns: 40px 118px minmax(0, 1fr); gap: 10px; padding: 7px 10px; border-bottom: 1px solid var(--line2); cursor: pointer; }
.pass:hover, .pass.sel { background: var(--paper2); }
.pass .po { font-family: var(--f-mono); color: var(--muted); font-size: 12px; text-align: right; }
.pass .pw { font-size: 11px; }
.pass .pl { font-weight: 500; }
.pass .io { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
.pass.faded { opacity: .3; }
.pass.disabled .pl { text-decoration: line-through; color: var(--off); }
.where-cpu { color: var(--ink2); }
.where-off { color: var(--create); }
.where-main { color: var(--accent); }
.where-load { color: var(--warn); }

.bar { height: 14px; background: var(--accent-soft); border-radius: 3px; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; opacity: .75; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 3px 10px; font-size: 12.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.note { font-size: 12px; color: var(--muted); border-left: 3px solid var(--line); padding: 2px 8px; }
.empty { color: var(--muted); font-style: italic; }
.vrow td.res-ok { color: var(--ok); font-weight: 700; }
.vrow td.res-bad { color: var(--bad); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>GameDraft 运行时结构图</h1>
      <div class="sub" id="brand-sub"></div>
    </div>
    <button class="theme-btn" id="theme-btn" type="button" title="切换明暗">明 / 暗</button>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>
<div class="shell" id="shell">

  }
  openDrawer(`动作注册表 · ${D.actions.length} 个`, nodes);
}

function showBlock(id) {

  nodes.push(el('div', { class: 'small muted' }, '归块规则(按顺序第一条命中):'), el('div', { class: 'mono small', style: 'overflow-wrap:anywhere' }, b.rules.join('  |  ')));

      citeBox({ f: P(r.from), l: r.l, why: `import ${r.names.join(', ')}` }), r.uses.map((u) => citeBox({ f: P(r.from), l: u[0], m: u[1], why: `${u[2]}${u[3] ? ' · DEV 守卫内' : ''}` }))))));
    const back = EDGE.dep.filter((e) => FILE.get(e.a).bd && !FILE.get(e.b).bd);
    nodes.push(fold(`边界 → 运行时(边界代码用到的正式模块)· ${back.length}`, false, back.map((e) => fold(`${P(e.a).replace(/^src\//, '')} → ${P(e.b).replace(/^src\//, '')}`, false, edgeItemNodes('dep', e)))));
  }
  const io = (dir) => {
    const list = [];
    for (const k of ['dep', 'evt', 'crt', 'typ']) for (const e of BEDGE[k]) if ((dir === 'out' ? e.a : e.b) === id) list.push(e);
    list.sort((x, y) => edgeWeight(y) - edgeWeight(x));
    return el('div', { style: 'display:flex;flex-direction:column;gap:3px' }, list.map((e) => {
      const other = dir === 'out' ? e.b : e.a;
      return el('button', { class: 'linkish small', type: 'button', onclick: () => showBlockEdge(e) }, `${kindName(e.kind)} ${dir === 'out' ? '→' : '←'} ${BLOCK.get(other).name}(${edgeWeight(e)})`);
    }));
  };
  nodes.push(fold(`出线:依赖 ${st.out.dep} · 事件 ${st.out.evt} · 创建 ${st.out.crt} · 仅类型 ${st.out.typ}`, true, io('out')));
  nodes.push(fold(`入线:依赖 ${st.inn.dep} · 事件 ${st.inn.evt} · 创建 ${st.inn.crt} · 仅类型 ${st.inn.typ}`, true, io('in')));
  nodes.push(fold(`成员文件(按行数)`, !b.boundary, el('table', { class: 't' }, el('tbody', null, b.files.map((f) => el('tr', { class: 'clickable', onclick: () => showFile(f) }, el('td', { class: 'mono' }, P(f).replace(/^src\//, ''), FILE.get(f).dbg ? ' ' : '', FILE.get(f).dbg ? chip('调试', 'dev') : null), el('td', { class: 'num mono' }, FILE.get(f).n)))))));
  openDrawer(b.name, nodes);
}

function edgeItemNodes(kind, e) {
  if (kind === 'dep' || kind === 'typ') {
    return e.sites.map((s) => citeBox({ f: P(e.a), l: s[0], why: `${base(P(e.a))} → ${base(P(e.b))}${s[1] ? '' : '(仅类型)'}` }));
  }
  if (kind === 'crt') return e.sites.map((s) => citeBox({ f: P(e.a), l: s[0], m: s[1], why: `${s[2]} 里 new ${s[1]}${s[3] ? ` → ${s[3]}` : ''}` }));
  if (kind === 'evt') {
    const out = [];
    for (const v of e.evs) {
      out.push(el('div', { class: 'row small' }, chip(v.e, 'evt'), v.bus !== 'main' ? chip(`私有总线 ${v.bus}`, 'warn') : null));
      for (const s of v.emit) out.push(citeBox({ f: P(s[0]), l: s[1], why: `发:${s[2]}` }));
      for (const s of v.on) out.push(citeBox({ f: P(s[0]), l: s[1], why: `收:${s[2]}${s[5] ? '(经私有总线装配)' : ''}` }));
    }
    return out;
  }
  return [];
}
function showBlockEdge(e) {
  const nodes = [el('p', { class: 'small muted' }, `${kindName(e.kind)}:${BLOCK.get(e.a).name} → ${BLOCK.get(e.b).name}。下面是背后每一条文件级连线及其代码出处。`)];
  const items = [...e.items].sort((x, y) => P(x.a).localeCompare(P(y.a)));
  for (const it of items) {
    const title = `${P(it.a).replace(/^src\//, '')}  →  ${P(it.b).replace(/^src\//, '')}${e.kind === 'evt' ? `  (${it.evs.map((v) => v.e).join(', ')})` : ''}${e.kind === 'crt' ? `  (new ${it.classes.join(', ')})` : ''}`;
    nodes.push(fold(title, items.length <= 4, edgeItemNodes(e.kind, it)));
  }
  openDrawer(`${BLOCK.get(e.a).name} → ${BLOCK.get(e.b).name} · ${kindName(e.kind)}`, nodes);
}

function showFile(fi) {

  nodes.push(el('a', { href: gh(p), target: '_blank', rel: 'noopener', class: 'small' }, `在仓库里看 ${p}`));
  const grp = (title, list, mk, open) => { if (list.length) nodes.push(fold(`${title} · ${list.length}`, open, list.map(mk))); };
  grp('依赖(运行时)', EDGE.dep.filter((e) => e.a === fi), (e) => fold(P(e.b), false, edgeItemNodes('dep', e)), true);
  grp('被依赖(运行时)', EDGE.dep.filter((e) => e.b === fi), (e) => fold(P(e.a), false, edgeItemNodes('dep', e)), false);
  grp('仅类型依赖', EDGE.typ.filter((e) => e.a === fi), (e) => fold(P(e.b), false, edgeItemNodes('typ', e)), false);
  const emits = D.events.filter((ev) => ev.emit.some((s) => s[0] === fi));

  grp('收听的事件', ons, (ev) => fold(`${ev.e}${ev.lNE ? '(没人发)' : ''}`, false, ev.on.filter((s) => s[0] === fi).map((s) => citeBox({ f: p, l: s[1], why: `${s[2]} ← ${s[3]}` })), ev.emit.map((s) => el('div', { class: 'small muted' }, `发:${P(s[0])}:${s[1]} ${s[2]}`))), false);
  grp('创建(new)', EDGE.crt.filter((e) => e.a === fi), (e) => fold(`${e.classes.join(', ')}  (${base(P(e.b))})`, false, edgeItemNodes('crt', e)), false);
  grp('被谁创建', EDGE.crt.filter((e) => e.b === fi), (e) => fold(`${P(e.a)}`, false, edgeItemNodes('crt', e)), false);
  const hs = D.holds.filter((h) => h[0] === fi);
  grp('声明持有(字段/构造参数)', hs, (h) => el('div', { class: 'row small' }, el('span', { class: 'mono' }, `${h[2]}.${h[3]}`), chip(h[4] === 'field' ? '字段' : h[4] === 'ctor-param' ? '构造注入' : '构造 deps'), el('span', null, h[5].map((c) => c[0]).join(', ')), cref({ f: p, l: h[1] })), false);
  const acts = D.actions.filter((a) => a[1] === fi);
  grp('注册的动作', acts, (a) => el('span', null, cref({ f: p, l: a[2], m: a[0] }), ' ', a[0]), false);
  const sts = D.states.filter((s) => s[0] === fi);
  grp('切换游戏状态', sts, (s) => el('div', { class: 'small' }, cref({ f: p, l: s[1] }), ` ${s[2]} → ${s[3]}(${s[4] ?? ''})`), false);
  openDrawer(base(p), nodes);
}

// ── 下钻:块内文件级分层图
function drill(id) {
  const main = $('#main');
  main.replaceChildren();
  const b = BLOCK.get(id);
  const crumb = el('div', { class: 'crumb' }, el('button', { class: 'linkish', type: 'button', onclick: () => go('modules') }, '模块总图'), '›', el('b', null, b.name), chip(`${b.fileCount} 文件`), chip(`${nf.format(b.lines)} 行`));
  main.append(crumb);
  main.append(el('p', { class: 'lede' }, '块内文件按依赖深度从左到右排:越靠左越"上层"(依赖别人),越靠右越"底层"(被依赖)。左右两侧的灰框是块外:左侧 = 依赖本块的外部块,右侧 = 本块依赖的外部块。点文件看它的全部进出连线与出处;点线看出处。'));
  const st = { dep: true, typ: false, evt: true, crt: false, ext: true };
  const tb = el('div', { class: 'map-toolbar' });
  const mk = (key, label, sw) => {
    const cb = el('input', { type: 'checkbox', id: `dg-${key}` });
    cb.checked = st[key];
    cb.addEventListener('change', () => { st[key] = cb.checked; draw(); });
    return el('label', { for: `dg-${key}` }, cb, sw ? el('span', { class: `swatch ${sw}` }) : null, label);
  };
  tb.append(mk('dep', '依赖', 'dep'), mk('evt', '事件', 'evt'), mk('crt', '创建', 'crt'), mk('typ', '仅类型', 'typ'), mk('ext', '显示块外连线'));
  main.append(tb);
  const wrap = el('div', { class: 'map-wrap panel', style: 'max-height:78vh;overflow:auto' });
  main.append(wrap);

  const fset = new Set(b.files);
  // 依赖深度(只按运行时依赖,块内)
  const outs = new Map();
  for (const e of EDGE.dep) if (fset.has(e.a) && fset.has(e.b)) { if (!outs.has(e.a)) outs.set(e.a, []); outs.get(e.a).push(e.b); }
  const rank = new Map(); const visiting = new Set();
  const R = (v) => {
    if (rank.has(v)) return rank.get(v);
    if (visiting.has(v)) return 0;
    visiting.add(v);
    let r = 0;
    for (const w of outs.get(v) || []) r = Math.max(r, R(w) + 1);
    visiting.delete(v);
    rank.set(v, r);
    return r;
  };
  for (const f of b.files) R(f);
  const linked = new Set();
  for (const e of [...EDGE.dep, ...EDGE.evt, ...EDGE.crt]) if (fset.has(e.a) && fset.has(e.b)) { linked.add(e.a); linked.add(e.b); }
  const maxR = Math.max(0, ...rank.values());
  const cols = [];
  for (const f of b.files) {
    const c = linked.has(f) ? maxR - rank.get(f) : maxR + 1;
    (cols[c] ||= []).push(f);
  }
  // 超长列拆分
  const MAXROWS = 22;
  const colsSplit = [];
  const colLabel = [];
  cols.forEach((c, i) => {
    if (!c) return;
    for (let k = 0; k < c.length; k += MAXROWS) { colsSplit.push(c.slice(k, k + MAXROWS)); colLabel.push(i === maxR + 1 ? '块内无连线' : `深度 ${maxR - i}`); }
  });
  // 重心排序
  const posY = new Map();
  colsSplit.forEach((c) => c.forEach((f, i) => posY.set(f, i)));
  const nbr = new Map();
  for (const e of [...EDGE.dep]) if (fset.has(e.a) && fset.has(e.b)) {
    (nbr.get(e.a) || nbr.set(e.a, []).get(e.a)).push(e.b);
    (nbr.get(e.b) || nbr.set(e.b, []).get(e.b)).push(e.a);
  }
  for (let pass = 0; pass < 4; pass++) {
    for (const c of colsSplit) {
      const bc = new Map(c.map((f) => { const ns = (nbr.get(f) || []).filter((x) => posY.has(x)); return [f, ns.length ? ns.reduce((a, x) => a + posY.get(x), 0) / ns.length : posY.get(f)]; }));
      c.sort((x, y) => bc.get(x) - bc.get(y));
      c.forEach((f, i) => posY.set(f, i));
    }
  }
  function draw() {
    const NW = 214; const NH = 24; const GX = 70; const GY = 7;
    const extIn = new Map(); const extOut = new Map(); // blockId -> [{kind, e}]
    const kinds = ['dep', 'evt', 'crt', 'typ'].filter((k) => st[k]);
    if (st.ext) for (const k of kinds) for (const e of EDGE[k]) {
      const inA = fset.has(e.a); const inB = fset.has(e.b);
      if (inA && !inB) { const o = FILE.get(e.b).b; (extOut.get(o) || extOut.set(o, []).get(o)).push({ k, e }); }
      if (!inA && inB) { const o = FILE.get(e.a).b; (extIn.get(o) || extIn.set(o, []).get(o)).push({ k, e }); }
    }
    const x0 = st.ext ? 190 : 20;
    const colX = colsSplit.map((_, i) => x0 + i * (NW + GX));
    const innerW = colsSplit.length * (NW + GX);
    const rightX = x0 + innerW + 30;
    const maxRows = Math.max(...colsSplit.map((c) => c.length), extIn.size, extOut.size, 1);
    const H = 40 + maxRows * (NH + GY) + 20;
    const W = rightX + (st.ext ? 170 : 0) + 20;
    const svg = sv('svg', { class: 'dig', width: W, height: H, viewBox: `0 0 ${W} ${H}` });
    const defs = sv('defs');
    for (const [k, col] of [['dep', 'var(--accent)'], ['typ', 'var(--accent)'], ['evt', 'var(--event)'], ['crt', 'var(--create)']]) defs.append(sv('marker', { id: `dh-${k}`, viewBox: '0 0 10 10', refX: 9, refY: 5, markerUnits: 'userSpaceOnUse', markerWidth: 8, markerHeight: 8, orient: 'auto-start-reverse' }, sv('path', { d: 'M0,0 L10,5 L0,10 z', fill: col })));
    svg.append(defs);
    const pos = new Map();
    colsSplit.forEach((c, i) => {
      svg.append(sv('text', { class: 'colhead', x: colX[i], y: 22, text: colLabel[i] }));
      c.forEach((f, j) => pos.set(f, [colX[i], 34 + j * (NH + GY)]));
    });
    const extPosIn = new Map(); const extPosOut = new Map();
    [...extIn.keys()].forEach((bid, j) => extPosIn.set(bid, [14, 34 + j * (NH + GY)]));
    [...extOut.keys()].forEach((bid, j) => extPosOut.set(bid, [rightX, 34 + j * (NH + GY)]));
    if (st.ext) {
      svg.append(sv('text', { class: 'colhead', x: 14, y: 22, text: '依赖本块的外部块' }));
      svg.append(sv('text', { class: 'colhead', x: rightX, y: 22, text: '本块依赖的外部块' }));
    }
    const gE = sv('g'); svg.append(gE);
    const curve = (x1, y1, x2, y2) => { const dx = Math.max(30, Math.abs(x2 - x1) * 0.45); return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`; };
    for (const k of kinds) for (const e of EDGE[k]) {
      const inA = fset.has(e.a); const inB = fset.has(e.b);
      let p1; let p2;
      if (inA && inB) { const a = pos.get(e.a); const bb = pos.get(e.b); p1 = [a[0] + NW, a[1] + NH / 2]; p2 = [bb[0], bb[1] + NH / 2]; if (bb[0] <= a[0]) { p2 = [bb[0] + NW, bb[1] + NH / 2]; p1 = [a[0] + NW, a[1] + NH / 2]; } }
      else if (st.ext && inA) { const a = pos.get(e.a); const bp = extPosOut.get(FILE.get(e.b).b); p1 = [a[0] + NW, a[1] + NH / 2]; p2 = [bp[0], bp[1] + NH / 2]; }
      else if (st.ext && inB) { const ap = extPosIn.get(FILE.get(e.a).b); const bb = pos.get(e.b); p1 = [ap[0] + 150, ap[1] + NH / 2]; p2 = [bb[0], bb[1] + NH / 2]; }
      else continue;
      const d = (p2[0] <= p1[0]) ? `M${p1[0]},${p1[1]} C${p1[0] + 60},${p1[1]} ${p2[0] + 60},${p2[1]} ${p2[0]},${p2[1]}` : curve(p1[0], p1[1], p2[0], p2[1]);
      const path = sv('path', { class: `edge ${k} f-${e.a} f-${e.b}`, d, 'stroke-width': 1.3, 'marker-end': `url(#dh-${k})`, 'data-a': e.a, 'data-b': e.b });
      const hit = sv('path', { class: 'edge-hit', d, onclick: () => openDrawer(`${base(P(e.a))} → ${base(P(e.b))} · ${kindName(k)}`, edgeItemNodes(k, e)) });
      hit.append(sv('title', { text: `${P(e.a)} → ${P(e.b)}(${kindName(k)})` }));
      gE.append(path, hit);
    }
    for (const [f, [x, y]] of pos) {
      const F = FILE.get(f);
      const g = sv('g', { class: `fnode${F.dbg ? ' dbg' : ''}`, 'data-f': f, onclick: () => { hl(svg, f); showFile(f); } });
      g.append(sv('rect', { x, y, width: NW, height: NH, rx: 4 }));
      g.append(sv('text', { x: x + 7, y: y + 16, text: (() => { const t = P(f).replace(/^src\//, '').replace(/\.ts$/, ''); return t.length > 29 ? '…' + t.slice(-28) : t; })() }));
      g.append(sv('text', { class: 'n', x: x + NW - 6, y: y + 16, 'text-anchor': 'end', text: F.n }));
      g.append(sv('title', { text: `${P(f)} · ${F.n} 行` }));
      svg.append(g);
    }
    const extNode = (bid, [x, y], list, side) => {
      const g = sv('g', { class: 'fnode ext', onclick: () => showBlock(bid) });
      g.append(sv('rect', { x, y, width: 150, height: NH, rx: 4 }));
      g.append(sv('text', { x: x + 7, y: y + 16, text: BLOCK.get(bid).name.slice(0, 11) }));
      g.append(sv('text', { class: 'n', x: x + 144, y: y + 16, 'text-anchor': 'end', text: list.length }));
      g.append(sv('title', { text: `${BLOCK.get(bid).name}:${side === 'in' ? '指向本块' : '本块指向它'}的文件级连线 ${list.length} 条` }));
      svg.append(g);
    };
    for (const [bid, p] of extPosIn) extNode(bid, p, extIn.get(bid), 'in');
    for (const [bid, p] of extPosOut) extNode(bid, p, extOut.get(bid), 'out');
    wrap.replaceChildren(svg);
  }
  function hl(svg, f) {
    svg.classList.add('dim');
    for (const n of svg.querySelectorAll('.hl, .sel')) n.classList.remove('hl', 'sel');
    const touched = new Set([String(f)]);
    for (const p of svg.querySelectorAll(`.edge.f-${f}`)) { p.classList.add('hl'); touched.add(p.dataset.a); touched.add(p.dataset.b); }
    for (const g of svg.querySelectorAll('.fnode')) {
      const on = g.dataset.f ? touched.has(g.dataset.f) : true;
      g.classList.toggle('hl', on);
      if (g.dataset.f === String(f)) g.classList.add('sel');
    }
  }
  draw();
  showBlock(id);
}

// ════════════════════════════════════ 通用:顺序步骤
const ASYNC_LABEL = { await: ['等完成', 'warn'], parallel: ['并行', 'warn'], 'fire-and-forget': ['发出不等', 'bad'], sync: ['同步', ''], event: ['发事件', 'evt'] };
function asyncChip(a) { if (!a || a === 'sync') return null; const x = ASYNC_LABEL[a] || [a, '']; return chip(x[0], x[1], `async: ${a}`); }
function statusChip(s) { if (s === 'disabled') return chip('已关停', 'off'); if (s === 'dev-only') return chip('仅开发构建', 'dev'); return null; }
function stepDetail(title, s, extra) {
  const nodes = [];
  const pairs = [];
  if (s.detail) nodes.push(el('p', { style: 'margin:0' }, s.detail));
  if (s.code) pairs.push(['代码', el('span', { class: 'mono' }, s.code)]);
  if (s.kind) pairs.push(['类别', KIND_ZH[s.kind] || s.kind]);

    c.example.map((s) => el('div', { class: 'small' }, el('span', { class: 'mono' }, `${base(P(s[0]))} → ${base(P(s[1]))}`), ' ', cref({ f: P(s[0]), l: s[2] }))),
    el('div', { class: 'small muted' }, `环内全部 ${c.inner.length} 条 import:`),
    c.inner.map((e) => el('div', { class: 'small' }, el('span', { class: 'mono' }, `${P(e[0]).replace(/^src\//, '')} → ${P(e[1]).replace(/^src\//, '')}`), ' ', e[2].map((l) => cref({ f: P(e[0]), l }))))));
  cyc.append(...cycList(A.cyclesRuntime));
  cyc.append(el('p', { class: 'small' }, `把"仅类型 import"也算上:`, el('b', null, `${A.cyclesAll.length} 个环`)));
  cyc.append(...cycList(A.cyclesAll));
  cyc.append(el('p', { class: 'small', style: 'margin-top:10px' }, `大块之间互相依赖(运行时,块级):${A.blockPairs.length} 对`));
  const bt = el('table', { class: 't' }, el('thead', null, el('tr', null, el('th', null, '块 A'), el('th', null, '块 B'), el('th', { class: 'num' }, 'A→B 文件级'), el('th', { class: 'num' }, 'B→A 文件级'))));
  const btb = el('tbody');
  for (const p of A.blockPairs) {
    const e1 = BEDGE.dep.find((e) => e.a === p.a && e.b === p.b); const e2 = BEDGE.dep.find((e) => e.a === p.b && e.b === p.a);
    btb.append(el('tr', null, el('td', null, BLOCK.get(p.a).name), el('td', null, BLOCK.get(p.b).name), el('td', { class: 'num' }, el('button', { class: 'linkish', type: 'button', onclick: () => showBlockEdge(e1) }, p.ab)), el('td', { class: 'num' }, el('button', { class: 'linkish', type: 'button', onclick: () => showBlockEdge(e2) }, p.ba))));
  }
  bt.append(btb);
  cyc.append(el('div', { class: 'tbl-wrap' }, bt));
  root.append(cyc);

  // 分层
  const lay = el('div', { class: 'panel pad', style: 'margin-top:14px' }, el('h3', null, '违反分层方向的依赖'));
  const LR = D.meta.layersRule;
  lay.append(el('p', { class: 'small' }, '判据:', LR.source, '。按目录定层:', LR.layers.map((l) => `${l.name}(${l.dirs.join(' ')})`).join(' > '), `。组装层例外:${LR.assembly.join(' ')}。`, LR.runtimeRule, '。 ', crefs(LR.cites, '判据出处')));
  lay.append(el('p', { class: 'small' }, el('b', null, `运行时违例 ${A.violations.length} 条`), `(下层 import 上层,编译后仍在);仅类型违例 ${A.violationsType.length} 条另列。`));
  const vt = (list) => {
    const g = new Map();
    for (const v of list) { const k = `${v[2]} → ${v[3]}`; (g.get(k) || g.set(k, []).get(k)).push(v); }
    return [...g].map(([k, vs]) => fold(`${k}:${vs.length} 条`, list === A.violations, vs.map((v) => el('div', { class: 'small' }, el('span', { class: 'mono' }, `${P(v[0]).replace(/^src\//, '')} → ${P(v[1]).replace(/^src\//, '')}`), ' ', v[5] ? chip('文档 §3.1 所列 Game 提取模块', 'dev', '架构文档说 Game 的部分职责委托给它;是否算组装层文档未写明') : null, ' ', v[4].map((s) => cref({ f: P(v[0]), l: s[0] }, s[1])), el('span', { class: 'muted' }, ` ${v[4].map((s) => s[1]).join('; ')}`)))));
  };
  lay.append(...vt(A.violations));
  lay.append(fold(`仅类型违例(编译后消失)· ${A.violationsType.length}`, false, vt(A.violationsType)));
  lay.append(fold(`规范未定层级的目录(entities / audio / src 根)涉及的依赖 · ${A.unlayered.length}`, false, A.unlayered.map((v) => el('div', { class: 'small' }, el('span', { class: 'mono' }, `${P(v[0]).replace(/^src\//, '')} → ${P(v[1]).replace(/^src\//, '')}`), ` (${v[2] ?? '未定'}→${v[3] ?? '未定'}${v[4] ? '' : ',仅类型'}) `, v[5].map((l) => cref({ f: P(v[0]), l }))))));
  root.append(lay);

  // 事件
  const evb = el('div', { class: 'panel pad', style: 'margin-top:14px' }, el('h3', null, '事件总线:有人发没人收 / 有人收没人发'));
  evb.append(el('p', { class: 'small' }, `按事件名字符串配对(主总线 ${D.events.filter((e) => e.bus === 'main').length} 个事件名)。事件名经包装函数转手的(`, D.wrappers.map((w) => el('span', { class: 'mono' }, `${w[0]}() `)), `)已追到调用点;destroy 里按登记表逐条 off 的不参与配对(见"抽不准")。`));
  const evRow = (ev, side) => fold(`${ev.e}${ev.bus !== 'main' ? `(私有总线 ${ev.bus})` : ''}`, false, (side === 'emit' ? ev.emit : ev.on).map((s) => citeBox({ f: P(s[0]), l: s[1], why: `${side === 'emit' ? '发' : '收'}:${s[2]}` })));
  const eNL = D.events.filter((e) => e.eNL);
  const lNE = D.events.filter((e) => e.lNE);
  evb.append(el('div', { class: 'grid2' },
    el('div', null, el('div', { class: 'row' }, chip(`有人发没人收 · ${eNL.length}`, 'warn')), eNL.map((e) => evRow(e, 'emit'))),
    el('div', null, el('div', { class: 'row' }, chip(`有人收没人发 · ${lNE.length}`, 'warn')), lNE.map((e) => evRow(e, 'on')))));
  const bb = D.meta.counts.busBindings || [];
  if (bb.length) evb.append(el('p', { class: 'note' }, '私有总线:', bb.map((b) => el('span', null, `${b.bus} 由 `, cref(b.cite), ` 把 ${b.files.join(', ')} 的一个实例接上;该实例在源码里的订阅按这条装配算到私有总线上,所以私有总线上会出现"有人收没人发"。`))));
  root.append(evb);

  // 开发/调试代码
  const dv = el('div', { class: 'panel pad', style: 'margin-top:14px' }, el('h3', null, '正式运行路径里引用到的开发、调试代码'));
  dv.append(el('p', { class: 'small' }, '两条规则:① 被引用方在 src/dev、src/debug、src/authoring(边界目录);② 被引用方不在边界目录,但文件名就是调试设施(DebugTools / DebugPanelUI / DevModeUI / debug*Section / dev*…),引用方不是。"值使用处"只算编译后仍在的使用(排除类型位置);"DEV 守卫内"= 语法上位于 import.meta.env.DEV / isDevBuild / devMode 条件分支或其早返回守卫之后。'));
  const dt = el('table', { class: 't' }, el('thead', null, el('tr', null, el('th', null, '引用方'), el('th', null, '被引用'), el('th', null, '规则'), el('th', null, 'import'), el('th', { class: 'num' }, '值使用处'), el('th', { class: 'num' }, '其中 DEV 守卫内'))));
  const dtb = el('tbody');
  for (const r of A.devRefs) {
    dtb.append(el('tr', { class: 'clickable', onclick: () => openDrawer(`${base(P(r.from))} → ${base(P(r.to))}`, [kv([['import 形式', `${r.form}${r.rt ? '(运行时)' : '(仅类型,编译后消失)'}`], ['导入名', r.names.join(', ')]]), citeBox({ f: P(r.from), l: r.l, why: 'import' }), ...r.uses.map((u) => citeBox({ f: P(r.from), l: u[0], m: u[1], why: `${u[2]}${u[3] ? ' · DEV 守卫内' : ''}` }))]) },
      el('td', { class: 'mono small' }, P(r.from).replace(/^src\//, '')), el('td', { class: 'mono small' }, P(r.to).replace(/^src\//, '')), el('td', { class: 'small' }, r.rule === 'boundary-dir' ? '边界目录' : '调试文件名'),
      el('td', null, cref({ f: P(r.from), l: r.l }), r.rt ? '' : chip('仅类型', 'off')), el('td', { class: 'num' }, r.uses.length), el('td', { class: 'num' }, r.uses.filter((u) => u[3]).length)));
  }
  dt.append(dtb);
  dv.append(el('div', { class: 'tbl-wrap' }, dt));
  const g = D.globals;
  dv.append(fold(`往 window / globalThis 挂的入口 · ${g.length}`, false, g.map((x) => el('div', { class: 'small' }, cref({ f: P(x[0]), l: x[1] }), ' ', el('span', { class: 'mono' }, x[3]), ` (${x[2]})`, x[4] ? chip('DEV 守卫内', 'dev') : null))));
  root.append(dv);
};

// ════════════════════════════════════ 抽不准 / 文档 / 已关停 / 核对
RENDER.uncertain = (root) => {
  const d = D.diagrams.uncertain;
  head(root, '抽不准的地方', '静态抽取看不见的关系:运行时拼出来的名字、按字符串查表分发、数据驱动的调用。这些关系在图上没有画,原因写在每一条里。');
  if (d?.items?.length) {
    const t = el('table', { class: 't' }, el('thead', null, el('tr', null, el('th', null, '类别'), el('th', null, '是什么'), el('th', null, '在哪'), el('th', null, '为什么抽不准'), el('th', null, '影响'), el('th', null, '出处'))));
    const tb = el('tbody');
    for (const u of d.items) tb.append(el('tr', null, el('td', { class: 'small' }, chip(u.kind)), el('td', null, u.label), el('td', { class: 'small' }, u.where), el('td', { class: 'small' }, u.why), el('td', { class: 'small muted' }, u.affects), el('td', null, crefs(u.cites, u.label))));
    t.append(tb);
    root.append(el('div', { class: 'tbl-wrap panel' }, t));
  } else missing(root, 'uncertain');
  root.append(el('h3', { style: 'margin:18px 0 8px' }, `抽取脚本自己标出来的 · ${D.dynamicRaw.length} 处`));
  const KN = { 'event-name': '事件名非字面量', 'map-dispatch': '查表取函数', 'element-call': '下标调用', 'string-switch': '按字符串 switch', 'dynamic-import': '动态 import', 'action-register': '动作名非字面量' };
  const t2 = el('table', { class: 't' }, el('thead', null, el('tr', null, el('th', null, '类别'), el('th', null, '代码'), el('th', null, '所在函数'), el('th', null, '说明'), el('th', null, '出处'))));
  const tb2 = el('tbody');
  for (const x of D.dynamicRaw) tb2.append(el('tr', null, el('td', { class: 'small' }, chip(KN[x[0]] || x[0])), el('td', { class: 'mono small' }, x[4]), el('td', { class: 'small' }, x[3]), el('td', { class: 'small muted' }, x[5]), el('td', null, cref({ f: P(x[1]), l: x[2] }))));
  t2.append(tb2);
  root.append(el('div', { class: 'tbl-wrap panel' }, t2));
};
RENDER.docs = (root) => {
  const d = D.diagrams.docs;
  head(root, '文档与代码对不上的地方', '文档只用来起名字;下面每条左边是文档怎么说(带文档出处),右边是代码实际(带代码出处)。以代码为准。');
  if (!d) return missing(root, 'docs');
  const list = el('div', { style: 'display:flex;flex-direction:column;gap:10px' });
  for (const m of d.mismatches || []) {
    list.append(el('div', { class: 'panel pad' }, el('h3', { style: 'margin-bottom:6px' }, m.topic),
      el('div', { class: 'grid2' },
        el('div', null, el('div', { class: 'row' }, chip('文档', 'warn')), el('p', { style: 'margin:4px 0' }, m.doc), crefs(m.docCites, '文档出处')),
        el('div', null, el('div', { class: 'row' }, chip('代码', 'dep')), el('p', { style: 'margin:4px 0' }, m.code), crefs(m.codeCites, '代码出处')))));
  }
  root.append(list);
  if (d.blockNames?.length) {
    root.append(el('h3', { style: 'margin:18px 0 8px' }, '块名的文档出处'));
    const t = el('table', { class: 't' }, el('thead', null, el('tr', null, el('th', null, '块'), el('th', null, '文档叫法'), el('th', null, '说明'), el('th', null, '出处'))));
    const tb = el('tbody');
    for (const b of d.blockNames) tb.append(el('tr', null, el('td', null, BLOCK.get(b.block)?.name || b.block), el('td', null, b.docName ?? el('span', { class: 'muted' }, '(文档里没有)')), el('td', { class: 'small muted' }, b.note || ''), el('td', null, crefs(b.cites))));
    t.append(tb);
    root.append(el('div', { class: 'tbl-wrap panel' }, t));
  }
  if (d.stateNames?.length) {
    root.append(el('h3', { style: 'margin:18px 0 8px' }, '游戏状态的文档叫法'));
    root.append(el('div', { class: 'row' }, d.stateNames.map((s) => el('span', { class: 'chip' }, `${s.state} = ${s.docName ?? '(无)'}`, ' ', crefs(s.cites)))));
  }
  uncertainBlock(root, d);
};
RENDER.disabled = (root) => {
  const d = D.diagrams.disabled;
  head(root, '已关停但保留的代码', '开关在代码里关着、代码仍留在仓库的路径。图上遇到它们一律标"已关停"。');
  if (!d) return missing(root, 'disabled');
  for (const it of d.items || []) {
    root.append(el('div', { class: 'panel pad', style: 'margin-bottom:10px' },
      el('div', { class: 'row' }, el('h3', null, it.label), chip('已关停', 'off')),
      kv([['开关', el('span', { class: 'mono' }, it.switch || '')], ['值', it.value], ['关掉了什么', it.what], ['涉及文件', (it.affectedFiles || []).join('、')], ['仍被运行时 import', it.stillImported]]),
      el('div', { style: 'margin-top:6px' }, crefs(it.cites, it.label))));
  }
  uncertainBlock(root, d);
};
RENDER.verify = (root) => {
  const v = D.verification;
  head(root, '抽样核对', v?.method || '随机抽 15 条箭头,回代码逐条核对出处。');
  if (!v) return root.append(el('p', { class: 'empty' }, '尚未核对。'));
  const ok = v.items.filter((x) => x.result === 'ok').length;
  root.append(el('p', null, el('b', null, `${ok} / ${v.items.length} 条与代码一致`), v.summary ? `。${v.summary}` : ''));
  const t = el('table', { class: 't' }, el('thead', null, el('tr', null, el('th', null, '#'), el('th', null, '来自'), el('th', null, '箭头'), el('th', null, '核对结果'), el('th', null, '核对说明'), el('th', null, '出处'))));
  const tb = el('tbody');
  v.items.forEach((x, i) => tb.append(el('tr', { class: 'vrow' }, el('td', { class: 'num mono' }, i + 1), el('td', { class: 'small' }, x.source), el('td', null, x.arrow), el('td', { class: x.result === 'ok' ? 'res-ok' : 'res-bad' }, x.result === 'ok' ? '一致' : '不一致'), el('td', { class: 'small' }, x.note), el('td', null, crefs(x.cites, x.arrow)))));
  t.append(tb);
  root.append(el('div', { class: 'tbl-wrap panel' }, t));
};

// ════════════════════════════════════ 启动
const initial = (location.hash || '').replace('#', '');
go(RENDER[initial] ? initial : 'modules', false);
})();

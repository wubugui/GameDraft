<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>地形工作台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #1b1d22; --panel: #23262d; --panel2: #2a2e36; --line: #3a3f4a; --fg: #e6e8ec; --dim: #9aa1ad;
    --accent: #6cb4ff; --warn: #ffb454; --err: #ff6b6b; --ok: #7ed492; --purple: #c792ea;
    --font: 13px/1.45 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: var(--font); overflow: hidden; user-select: none; }
  input, textarea { user-select: text; }
  button, select, input { font: inherit; color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; }
  button { cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--accent); }
  button.primary { background: #2c4f7a; border-color: #3f6ea8; }
  button.danger { border-color: #7a3c3c; }
  button.on { background: #2c4f7a; border-color: var(--accent); }
  button.primary.dirty { background: #6a4a16; border-color: var(--warn); color: #ffe2b0; }
  button.export.pending { border-color: var(--warn); color: #ffe2b0; }
  button:disabled { opacity: .45; cursor: default; }
  input[type=number] { width: 72px; }
  input[type=range] { width: 120px; }
  #app { display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 46px minmax(190px, 250px) minmax(240px, 1fr) minmax(300px, 400px); height: 100%; }
  #app[inert] { filter: saturate(.5) brightness(.8); }
  #top { grid-column: 1 / span 4; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 5px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #top .grp { display: inline-flex; gap: 6px; align-items: center; }
  #top .grp b { color: var(--dim); font-weight: 500; }
  #tools { display: flex; flex-direction: column; gap: 4px; padding: 6px 4px; background: var(--panel); border-right: 1px solid var(--line); align-items: center; }
  #tools button { width: 36px; height: 34px; padding: 0; font-size: 15px; }
  #tools .sep { height: 1px; width: 28px; background: var(--line); margin: 4px 0; }
  #tools button.walk { color: #7ed492; } #tools button.block { color: #ff6b6b; }
  #left { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column; }
  #left h3, #side h3 { margin: 8px 10px 4px; font-size: 12px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .item { display: flex; gap: 6px; align-items: center; padding: 3px 10px; cursor: pointer; border-left: 3px solid transparent; }
  .item:hover { background: var(--panel2); }
  .item.on { background: #2c4f7a; border-left-color: var(--accent); }
  .item .ic { width: 14px; height: 14px; border-radius: 3px; flex: none; }
  .item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .sub { color: var(--dim); font-size: 11px; }
  .item button { padding: 0 5px; font-size: 11px; }
  #center { position: relative; overflow: hidden; background: #111; }
  #center canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #overlay3d { pointer-events: none; }
  #coords { position: absolute; left: 8px; bottom: 8px; z-index: 5; color: var(--dim); background: rgba(0,0,0,.55); padding: 3px 8px; border-radius: 4px; font: 12px Consolas, "Cascadia Mono", monospace; white-space: pre; pointer-events: none; }
  #legend { position: absolute; right: 8px; bottom: 8px; z-index: 5; color: var(--dim); background: rgba(0,0,0,.5); padding: 4px 8px; border-radius: 4px; font-size: 12px; pointer-events: none; line-height: 1.5; max-width: 60%; }
  #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 3px -1px 0; }
  #viewbtns { position: absolute; left: 8px; top: 8px; z-index: 5; display: flex; gap: 4px; max-width: calc(100% - 16px); pointer-events: none; }
  #side { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 0 0 10px; display: flex; flex-direction: column; }
  .sec { padding: 2px 10px 6px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
  .sec h4 { margin: 6px 0 2px; font-size: 12px; color: var(--dim); font-weight: 600; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row > span:first-child { width: 76px; color: var(--dim); flex: none; font-size: 12px; }
  .row select, .row input[type=text] { flex: 1; min-width: 0; }
  .unit { color: var(--dim); font-size: 11px; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .dim { color: var(--dim); }
  .warn { color: var(--warn); }
  .err { color: var(--err); }
  .mono { font: 12px Consolas, "Cascadia Mono", monospace; }
  .pad { padding: 4px 0; font-size: 12px; }
  .kv { display: flex; gap: 8px; padding: 1px 10px; font-size: 12px; }
  .kv > span:first-child { width: 72px; color: var(--dim); flex: none; }
  label.chk { display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; font-size: 12px; }
  #bottom { grid-column: 1 / span 4; display: flex; gap: 14px; align-items: center; padding: 4px 10px; background: var(--panel); border-top: 1px solid var(--line); font-size: 12px; }
  #status { flex: 1; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status.err { color: var(--err); } #status.warn { color: var(--warn); } #status.ok { color: var(--ok); }
  .chip { padding: 2px 8px; border-radius: 10px; font-size: 12px; border: 1px solid var(--line); white-space: pre-line; }
  .chip.ok { color: var(--ok); border-color: #3f7a4a; } .chip.warn { color: var(--warn); border-color: #7a5a2c; }
  .chip.bad { color: var(--err); border-color: #7a3c3c; } .chip.off { color: var(--dim); }
  #busy { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; font-size: 15px; }
  #dialog { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; }
  #dialogForm { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; min-width: 360px; max-width: 640px; display: flex; flex-direction: column; gap: 8px; }
  #dialogForm h3 { margin: 0 0 4px; } #dialogForm p { margin: 0; color: var(--dim); white-space: pre-line; }
  #dialogForm .row > span:first-child { width: 120px; }
  #dialogForm .btns { justify-content: flex-end; }
  #reachList .item.bad { border-left-color: var(--err); }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="grp"><b>场景</b><select id="sceneSel" title="工程场景（有深度的才能编辑地形）"></select>
      <b>原画</b><select id="bgSel" title="按哪张时段原画看 3D / 原画（碰撞网格全时段共用；行走面按时段各一份，修补对每份都算）"></select>
      <button id="btnLaunchGame" class="primary" title="一键拉起游戏进这个场景：游戏在跑就切场景；dev server 在跑就打开游戏页；都没有就让开发控制台起">▶ 拉起游戏进本场景</button></span>
    <span class="grp"><button id="btnUndo" disabled>↶</button><button id="btnRedo" disabled>↷</button>
      <button id="btnSave" class="primary" title="Ctrl+S：写作者层（terrain/），不动游戏读的产物">保存</button>
      <button id="btnPush" title="P：页面此刻这份（存没存都算）合成进本机预览，让在跑的游戏原地换上；资源不动">推给游戏</button>
      <button id="btnExport" class="export" title="B：先保存，再把作者层合成进资源（collision.png / collision.json / 各时段 ground_d.png），游戏换回资源">导出到游戏</button>
      <button id="btnHistory" title="历史版本（每次保存前留一份）">历史…</button></span>
    <span class="grp" style="margin-left:auto"><span id="alignChip" class="chip off" title="运行时对齐：请在跑的游戏用它自己的 isCollision 判一批格心，与这里的合成结果逐点比">对齐 …</span><span id="linkChip" class="chip">…</span></span>
  </div>
  <div id="tools">
    <button data-tool="select" title="选择 / 变换（V）：点顶点或区域内部选中，W 移动，拖动 Ctrl 吸附；Delete 删顶点 / 区域">⬚</button>
    <button data-tool="polyWalk" class="walk" title="画可走多边形（P）：逐点点击，双击 / Enter 闭合，右键 / Backspace 退一点，Esc 取消">◇</button>
    <button data-tool="polyBlock" class="block" title="画阻挡多边形（Shift+P）：阻挡压过一切可走">◆</button>
    <button data-tool="rectWalk" class="walk" title="拉可走矩形（B）：按住拖一个框">▭</button>
    <button data-tool="rectBlock" class="block" title="拉阻挡矩形（Shift+B）">▬</button>
    <button data-tool="brush" title="笔刷（K）：按住拖着涂格子；右栏选 可走 / 阻挡 / 擦掉；[ ] 或 Shift+滚轮改半径；右键点一下 = 擦">✎</button>
    <button data-tool="height" title="行走面高度（H）：雕刻笔刷（抬 / 压 / 平滑 / 压平）或画高度多边形（压平到某高度 / 整块抬高，带羽化）">⛰</button>
    <button data-tool="inspect" title="检视（I）：点一格，看它由谁决定、走不走得到、高度增量">?</button>
    <button data-tool="pan" title="平移（空格 / 中键）">✋</button>
    <div class="sep"></div>
    <button id="btnView3" title="3D 视图（1）">3D</button>
    <button id="btnView2" title="2D 原画视图（2）">2D</button>
    <button id="btnTop" title="顶视（3）：正交、从上往下，碰撞格铺成一张图">⊤</button>
    <div class="sep"></div>
    <button id="btnFocus" title="对准选中（F）">⌖</button>
    <button id="btnFit" title="整场（Home）">⛶</button>
  </div>
  <div id="left">
    <h3>可走 / 阻挡多边形</h3>
    <div id="regionList"></div>
    <h3>高度操作</h3>
    <div id="opList"></div>
    <h3>连通性</h3>
    <div id="reachList"></div>
    <h3>图层</h3>
    <div class="pad" style="display:flex;flex-direction:column;gap:3px;padding:0 10px">
      <label class="chk"><input type="checkbox" id="layer_cells"> 碰撞格</label>
      <label class="chk"><input type="checkbox" id="layer_walkTint"> 可走格也上色（淡绿）</label>
      <label class="chk"><input type="checkbox" id="layer_cellLines"> 格线</label>
      <label class="chk"><input type="checkbox" id="layer_reach"> 走不到的可走格（黄）</label>
      <label class="chk"><input type="checkbox" id="layer_height"> 行走面修补（蓝）</label>
      <label class="chk"><input type="checkbox" id="layer_regions"> 多边形</label>
      <label class="chk"><input type="checkbox" id="layer_marks"> 出生点 / 出口 / 跨点 / NPC</label>
      <label class="chk"><input type="checkbox" id="layer_mesh"> 场景</label>
      <label class="chk"><input type="checkbox" id="layer_dimMesh"> 场景压暗</label>
      <label class="chk"><input type="checkbox" id="layer_grid"> 地面网格（2 m）</label>
    </div>
    <h3>游戏</h3>
    <div id="gamePanel"></div>
  </div>
  <div id="center">
    <canvas id="view3d"></canvas>
    <canvas id="overlay3d"></canvas>
    <canvas id="view2d" hidden></canvas>
    <div id="coords"></div>
    <div id="legend"><i style="background:rgba(242,77,77,.6)"></i>自动阻挡 <i style="background:rgba(255,89,191,.7)"></i>笔刷阻挡 <i style="background:rgba(255,140,51,.7)"></i>多边形阻挡 <i style="background:rgba(89,242,115,.7)"></i>作者改成可走 <i style="background:rgba(255,230,77,.7)"></i>走不到 <i style="background:rgba(77,128,255,.7)"></i>行走面修补<br>
      V 选择 · P 多边形 · B 矩形 · K 笔刷 · H 高度 · I 检视 · Shift 切阻挡 · [ ] 半径 · Enter 闭合 · Esc 取消 · 1/2/3 3D / 原画 / 顶视<br>
      右键拖 环视（按住 WASD/QE 飞）· Alt+左键 环绕 · 中键 平移 · 滚轮 朝光标缩放 · F 对准 · Home 整场</div>
    <div id="viewbtns"><span id="sceneNote" class="chip"></span></div>
  </div>
  <div id="side">
    <div id="inspector"></div>
  </div>
  <div id="bottom"><span id="docState"></span><span id="status"></span></div>
</div>
<div id="busy" hidden><span id="busyText"></span></div>
<div id="dialog" hidden><form id="dialogForm"></form></div>
<script src="/vendor/dropdown.js"></script>
<script src="/vendor/common.js"></script>
<script src="/vendor/history.js"></script>
<script src="/vendor/gizmo.js"></script>
<script src="/viewer/terrain_math.js"></script>
<script src="/viewer/view3d.js"></script>
<script src="/viewer/view2d.js"></script>
<script src="/viewer/app.js"></script>
</body>
</html>

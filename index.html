<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雾津</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    /*
     * 布局链（显示比例的唯一定义处，别在别的 CSS 里再给这三个元素写尺寸规则）：
     *   #app-shell  横向 flex：舞台 + F2 调试坞（调试坞样式在 src/ui/debug-panel-dock.css）
     *   #game-stage 宿主给游戏的可用区域（调试坞打开时被挤窄），把画面盒居中
     *   #game-mount 画面盒：固定视口时由 Renderer.layoutMount 按舞台算成最大的同比例盒（信箱/柱箱），
     *               自由视口时 100%×100%。canvas 与所有 DOM 覆盖层都挂在它上面。
     * 2026-09-06 之前 #game-mount 直接在 #app-shell 里且 flex:1 1 auto，被横向撑满窗口，
     * 4:3 的画在 1280×720 的 exe 窗里被拉成 16:9。
     */
    #app-shell { display: flex; width: 100%; height: 100%; overflow: hidden; }
    #game-stage {
      flex: 1 1 auto; min-width: 0; min-height: 0;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    #game-mount { flex: 0 0 auto; position: relative; width: 100%; height: 100%; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="app-shell">
    <div id="game-stage">
      <div id="game-mount"></div>
    </div>
    <aside id="debug-dock" aria-hidden="true"></aside>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

[pytest]
minversion = 8.0

# 不写 testpaths 时裸跑 `pytest` 会扫到 .claude/worktrees/ 里的测试副本 → 同名模块冲突。
# 刻意只收 tools：`scripts/test_oss_bootstrap_contract.py` 那 6 条**当前就是失败的**
# （sync_dvc_cache 里没有 is_likely_oss_auth_or_access_failure，测试比脚本旧），
# 且 scripts/ 上面没有 conftest（拿不到仓库写保护）。要跑它显式给路径：
#   pytest scripts/test_oss_bootstrap_contract.py
testpaths = tools

norecursedirs = .* build dist node_modules venv {arch} *.egg tmp output artifact godot_port asset-backups

# 刻意不放 -q：validator.md / agent_docs 里的命令行本身带 -q，
# addopts 再放一个会叠成 -qq（verbosity -2），把 "N passed" 汇总行吞掉。
#
# 也刻意不放 --strict-markers / --strict-config：pytest 9.0.3 上这两个开关**从 addopts
# 走不生效**（实测只出 PytestUnknownMarkWarning，命令行给同样的 flag 才会 collection error），
# 写在这里等于挂一道假护栏。真要收紧就在命令行给，或改用 filterwarnings 提升告警。
#
# -n auto --dist loadfile：编辑器测试大量用 unittest 的 setUpClass（一个 class 一次
# ProjectModel 全工程加载），且同 class 内有顺序依赖，所以按**文件**分发而不是按
# 测试分发——loadfile 保住 setUpClass 语义与类内顺序，与串行完全一致。
# 调单条测试时用 -n0 关掉（--pdb 与 xdist 不兼容）。
addopts =
    -ra
    --durations=10
    -n auto
    --dist loadfile

filterwarnings =
    ignore:distutils Version classes are deprecated:DeprecationWarning
